name: CI

# PR 은 이 워크플로가 통과해야 완료할 수 있다. (브랜치 보호의 필수 상태 체크: "quality")
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 개발 빌드와 같은 이미지(claudeclangbuild)를 사용한다.
      - uses: docker/setup-buildx-action@v3
      - name: Build image (claudeclangbuild)
        uses: docker/build-push-action@v6
        with:
          context: docker/build
          load: true
          tags: claudeclangbuild
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 검사 하나가 실패해도 나머지를 계속 실행하고, 마지막 Verdict 에서 종합해 실패 처리한다.
      - name: Build
        id: build
        continue-on-error: true
        run: ci/in-docker.sh ci/build.sh

      - name: Static analysis (Cppcheck)
        id: static
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ci/in-docker.sh ci/static_analysis.sh

      - name: Metrics (Lizard CCN<=10, length<=80 / CLOC comment ratio)
        id: metrics
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ci/in-docker.sh ci/metrics.sh

      - name: Docs (Doxygen, Human-in-the-Loop tags, UML)
        id: docs
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ci/in-docker.sh ci/docs.sh

      - name: SBOM (CycloneDX)
        id: sbom
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ci/in-docker.sh ci/sbom.sh

      - name: Unit test (success 100%, MC/DC 100%)
        id: unit
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ci/in-docker.sh ci/test.sh unit

      - name: Integration test (success 100%, function coverage 100%)
        id: integration
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ci/in-docker.sh ci/test.sh integration

      - name: TDD test
        id: tdd
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ci/in-docker.sh ci/test.sh tdd

      - name: Summary
        if: ${{ !cancelled() }}
        run: ci/in-docker.sh python3 ci/summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: reports/
          if-no-files-found: ignore

      - name: Verdict
        if: ${{ !cancelled() }}
        env:
          RESULTS: >-
            build=${{ steps.build.outcome }}
            static=${{ steps.static.outcome }}
            metrics=${{ steps.metrics.outcome }}
            docs=${{ steps.docs.outcome }}
            sbom=${{ steps.sbom.outcome }}
            unit=${{ steps.unit.outcome }}
            integration=${{ steps.integration.outcome }}
            tdd=${{ steps.tdd.outcome }}
        run: |
          failed=""
          for item in $RESULTS; do
            case "${item#*=}" in
              success|skipped) ;;
              *) failed="$failed ${item%%=*}" ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "::error::품질 기준 미충족:$failed"
            exit 1
          fi
          echo "모든 품질 기준 충족"
