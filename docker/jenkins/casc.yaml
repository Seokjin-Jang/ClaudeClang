jenkins:
  systemMessage: "ClaudeClang CI (Jenkins LTS)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"

security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

jobs:
  - script: >
      multibranchPipelineJob('ClaudeClang') {
        branchSources {
          git {
            id('claudeclang-git')
            remote('https://github.com/Seokjin-Jang/ClaudeClang.git')
            includes('main develop')
            excludes('')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(20)
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('1d')
          }
        }
      }
